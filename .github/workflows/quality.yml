name: Qualität und Sicherheit

# Pflichtenheft 10.1/10.5: bekannte Sicherheitslücken in Abhängigkeiten
# (composer audit, npm audit), Code-Stil (Pint) und statische Analyse
# (Larastan). Läuft bei jedem Push mit Code-Änderung, jeden Montag (neue
# Sicherheitsmeldungen auch ohne Code-Änderung) und auf Knopfdruck. Schlägt
# ein Lauf fehl, schickt GitHub eine Mail. Der Deploy übernimmt einen grünen
# Lauf für denselben Commit und spart sich dann die SQLite-Tests.

on:
  push:
    branches:
      - claude/dpsg-trier-homepage-design-jwdgs4
      - claude/kluft-instanzen
    # Reine Doku- und Datei-Commits brauchen keinen Lauf (Actions-Minuten).
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'instanzen/*/dateien/**'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Larastan-Baseline neu erzeugen und im Log ausgeben'
        type: boolean
        default: false

# Schnell hintereinander gepusht: nur der letzte Stand wird geprüft.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  sicherheit:
    name: Sicherheitslücken in Abhängigkeiten
    runs-on: ubuntu-24.04  # bewusst festgeschrieben; Wechsel auf 26.04 erst nach einem Probelauf
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: PHP-Pakete (composer audit)
        run: composer audit --no-interaction --locked
      - name: JavaScript-Pakete (npm audit, ab „hoch“)
        run: npm audit --audit-level=high

  code:
    name: Code-Stil und statische Analyse
    runs-on: ubuntu-24.04  # bewusst festgeschrieben; Wechsel auf 26.04 erst nach einem Probelauf
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, gd, zip, xml, curl, openssl, pdo_sqlite
          coverage: none
      - name: Composer-Cache finden
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: PHP-Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress
      - name: Code-Stil (Pint)
        run: vendor/bin/pint --test
      - name: Statische Analyse (Larastan)
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          if [ "${{ inputs.baseline }}" = "true" ]; then
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G --generate-baseline=phpstan-baseline.neon --allow-empty-baseline || true
            echo "----- BASELINE START -----"
            cat phpstan-baseline.neon
            echo "----- BASELINE END -----"
          else
            vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=table
          fi

  tests:
    # Jede Kluft-Instanz einzeln: Tests einer anderen Instanz (#[Group('…')])
    # überspringt tests/TestCase.php selbst.
    name: Tests (${{ matrix.instanz }})
    runs-on: ubuntu-24.04  # bewusst festgeschrieben; Wechsel auf 26.04 erst nach einem Probelauf
    strategy:
      fail-fast: false
      matrix:
        instanz: [dv-trier, saar-hochwald, roden]
    env:
      KLUFT_INSTANZ: ${{ matrix.instanz }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, gd, zip, xml, curl, openssl, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Composer-Cache finden
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Composer-Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: PHP-Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress
      # Views nutzen @vite(); ohne public/build/manifest.json schlagen
      # gerenderte Seiten fehl.
      - name: Frontend-Assets bauen
        run: |
          npm ci
          npm run build
      - name: Bilder der Instanz bereitstellen
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan kluft:assets
      - name: Tests
        run: php artisan test

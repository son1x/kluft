name: Barrierefreiheit und Performance

# Pflichtenheft 7.3 und 10.3: axe (WCAG 2.2 AA) auf den wichtigsten Seiten
# (Desktop und Handy) und Lighthouse, je Kluft-Instanz mit gesetzter
# MONITOR_URL (GitHub-Environment). Jeden Montag und auf Knopfdruck; rot bei
# Barrierefreiheits-Verstößen. Ergebnisse in der Zusammenfassung des Laufs.

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

jobs:
  pruefen:
    name: Web-Checks (${{ matrix.instanz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        instanz: [dv-trier, saar-hochwald]
    environment: ${{ matrix.instanz }}
    env:
      SITE: ${{ vars.MONITOR_URL }}
      KLUFT_INSTANZ: ${{ matrix.instanz }}
    steps:
      - name: Nicht eingerichtet
        if: env.SITE == ''
        run: echo "Keine MONITOR_URL im Environment ${{ matrix.instanz }} – übersprungen."
      - uses: actions/checkout@v4
        if: env.SITE != ''
      - uses: actions/setup-node@v4
        if: env.SITE != ''
        with:
          node-version: '22'
      - name: Werkzeuge installieren
        if: env.SITE != ''
        run: |
          npm install --no-save --no-package-lock playwright@1 @axe-core/playwright lighthouse@12 chrome-launcher
          npx playwright install --with-deps chromium
      - name: Prüfen
        if: env.SITE != ''
        run: |
          # Seitenlisten aus der Konfiguration der Instanz.
          export WEB_CHECK_PAGES="$(php scripts/web-check-pages.php | sed -n 1p)"
          export WEB_CHECK_LIGHTHOUSE="$(php scripts/web-check-pages.php | sed -n 2p)"
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node scripts/web-checks.mjs

name: Server-Prüfung

# Führt eine Prüfung bzw. einen Abruf auf dem Server aus, ohne Geheimnisse
# auszugeben. Instanz wählen; Zugang aus deren GitHub-Environment.
# GitHub → Actions → „Server-Prüfung“ → „Run workflow“.

on:
  workflow_dispatch:
    inputs:
      instanz:
        description: 'Instanz (GitHub-Environment)'
        type: choice
        options:
          - dv-trier
          - saar-hochwald
        required: true
      check:
        description: 'Was prüfen?'
        type: choice
        options:
          - calendar:check
          - calendar:sync
          - cron:info
          - brevo:check
          - mail:check-allowlist
          - backup:status
          - backup:run
          - whatsapp:check
          - mitglieder:check
        default: calendar:check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.instanz }}
    env:
      PHP_BIN: ${{ vars.PHP_BIN || '/usr/bin/php' }}
    steps:
      - name: Secrets bereinigen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || secrets.FTP_SERVER_DIR }}
        run: |
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          {
            echo "SSH_HOST=$(trim "$SSH_HOST")"
            echo "SSH_PORT=$(trim "${SSH_PORT:-22}")"
            echo "SSH_USERNAME=$(trim "$SSH_USERNAME")"
            echo "SSH_TARGET_DIR=$(trim "$SSH_TARGET_DIR")"
          } >> "$GITHUB_ENV"

      - name: Prüfung auf dem Server
        uses: appleboy/ssh-action@v1
        env:
          CHECK: ${{ inputs.check }}
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CHECK
          script: |
            cd "${{ env.SSH_TARGET_DIR }}"
            case "$CHECK" in
              calendar:check) "${{ env.PHP_BIN }}" artisan calendar:check ;;
              # Mitgliederverwaltung (NaMi 2 / NaMi 3): Anmeldung und Testsuche, ohne Mitgliederdaten.
              mitglieder:check) "${{ env.PHP_BIN }}" artisan mitglieder:check ;;
              # Kalender sofort abrufen (sonst alle 15 Minuten per Cronjob), danach Stand zeigen.
              calendar:sync) "${{ env.PHP_BIN }}" artisan calendar:sync; "${{ env.PHP_BIN }}" artisan calendar:check ;;
              # Angaben für den Cronjob (Plesk oder vServer): Pfad und PHP-Version.
              cron:info)
                echo "Projektverzeichnis: $(pwd -P)"
                echo "artisan vorhanden: $([ -f artisan ] && echo ja || echo nein)"
                echo "Home: $HOME"
                echo "php im Pfad: $(command -v php) – $(php -v 2>/dev/null | head -n1)"
                echo "PHP_BIN: $("${{ env.PHP_BIN }}" -v 2>/dev/null | head -n1)"
                for v in /opt/plesk/php/*/bin/php; do [ -x "$v" ] && echo "$v: $($v -v 2>/dev/null | head -n1)"; done
                echo "vendor/autoload.php vorhanden: $([ -f vendor/autoload.php ] && echo ja || echo nein)"
                "${{ env.PHP_BIN }}" artisan --version
                ;;
              # Brevo: API-Schlüssel/IP-Freigabe, Liste, Double-Opt-In-Vorlage
              # (verschickt nichts); dazu die letzten Brevo-Fehler aus dem Log.
              brevo:check)
                "${{ env.PHP_BIN }}" artisan brevo:check || true
                echo "---- Letzte Brevo-Fehler im Log ----"
                grep -h 'Brevo' storage/logs/laravel*.log 2>/dev/null | tail -n 5 | cut -c1-400 \
                  | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g' || echo "(keine)"
                ;;
              # Wirksame Ausnahmen der Test-Mail-Umleitung (Adressen gekürzt).
              mail:check-allowlist) "${{ env.PHP_BIN }}" artisan mail:check-allowlist ;;
              # Backups: Voraussetzungen und letzter Stand (keine Geheimnisse).
              backup:status) "${{ env.PHP_BIN }}" artisan backup:status ;;
              # Backup sofort erstellen und Wiederherstellung prüfen (sonst täglich 2 Uhr).
              backup:run) "${{ env.PHP_BIN }}" artisan backup:run && "${{ env.PHP_BIN }}" artisan backup:verify; "${{ env.PHP_BIN }}" artisan backup:status ;;
              *) echo "Unbekannte Prüfung"; exit 1 ;;
            esac

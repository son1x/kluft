name: Deploy

# Kluft: ein Deploy für alle Instanzen. Beim Start (Actions → „Deploy“ →
# „Run workflow“) die Instanz wählen; der Job läuft dann im gleichnamigen
# GitHub-Environment (Settings → Environments) und nimmt dessen Secrets und
# Variablen. Baut und testet das CMS, lädt Quellcode + gebaute Assets per
# SFTP hoch und führt per SSH Migrationen und Aufräumarbeiten aus. Läuft auf
# Webspace (Netcup/Plesk) wie auf einem vServer; es braucht nur SFTP/SSH,
# PHP-CLI und einen Cronjob, kein composer/npm auf dem Server.
#
# „Nur prüfen“: baut und testet, meldet sich per SSH an und prüft PHP,
# Zielordner und Speicher – lädt nichts hoch und ändert nichts.
#
# Warum vendor/ als EIN Archiv: >36.000 Einzeldateien per SFTP dauern
# 30–40+ Minuten; auf Webspaces ist composer per SSH oft nicht aufrufbar.
# vendor/ wird in der CI gebaut, gepackt und auf dem Server entpackt.
#
# lftp „mirror --reverse --delete“ spiegelt den Zielordner auf den Stand
# dieses Branches (außer den unten ausgeschlossenen Pfaden).
#
# Datenbank: MariaDB, sobald DB_HOST und DB_DATABASE gesetzt sind (dazu
# DB_PORT, DB_USERNAME, DB_PASSWORD), sonst SQLite. Beim ersten Deploy mit
# MariaDB werden vorhandene SQLite-Inhalte einmalig übernommen.
#
# Je Environment (dv-trier, saar-hochwald, …):
#   Variablen (als Secret eingetragen gehen sie auch):
#              APP_URL (Pflicht), MAIL_FROM_ADDRESS (Pflicht),
#              MAIL_FROM_NAME, APP_NAME (Standard: Name der Instanz),
#              APP_ENV (Standard local), PHP_BIN (Standard /usr/bin/php),
#              MONITOR_URL (für Monitoring und Web-Checks)
#   Secrets:   SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PRIVATE_KEY,
#              SSH_TARGET_DIR (absoluter Pfad des Projekts),
#              FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
#              (ohne FTP_PASSWORD: SFTP mit dem SSH-Schlüssel, Werte aus
#              SSH_*), DB_*, ENTRA_*, BREVO_*, MAIL_TEST_*, BACKUP_*,
#              NTFY_*, WHATSAPP_*, NEXTCLOUD_ALLOWED_HOSTS,
#              MITGLIEDER_DRIVER, NAMI_*, HITOBITO_*
#   Liste mit Erklärung: docs/deploy.md

on:
  # Nur von Hand (seit 19.10.2026, Actions-Minuten sparen): Wer etwas live
  # haben will, startet den Deploy für die Instanz.
  workflow_dispatch:
    inputs:
      instanz:
        description: 'Instanz (GitHub-Environment)'
        type: choice
        options:
          - dv-trier
          - saar-hochwald
          - roden
        required: true
      nur_pruefen:
        description: 'Nur prüfen: bauen, testen, Server-Zugang prüfen – nichts hochladen'
        type: boolean
        default: false
      force_seed:
        description: 'db:seed auch bei bereits bestehender DB erzwingen (z. B. nach einem neuen Seeder wie RequiredPagesSeeder)'
        type: boolean
        default: false
      runner:
        description: 'Wo der Job läuft: github (Actions-Minuten) oder nas (eigener Runner, docs/runner.md)'
        type: choice
        options:
          - github
          - nas
        default: github

# Verhindert, dass zwei Deploys gleichzeitig auf denselben Server-Ordner
# schreiben (z. B. wenn kurz hintereinander gepusht wird, oder ein alter,
# sehr langsamer Lauf noch läuft, während ein neuer startet). Ein neuer
# Lauf bricht einen noch laufenden älteren Lauf desselben Branches ab,
# statt parallel dagegen zu laufen.
# actions: read für „Qualität für diesen Stand schon grün?“.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.instanz || 'dv-trier' }}
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub: ubuntu-24.04 bewusst festgeschrieben (Wechsel auf 26.04 erst nach
    # einem Probelauf). NAS: eigener Runner mit Label „nas“ (docs/runner.md).
    runs-on: ${{ inputs.runner == 'nas' && fromJSON('["self-hosted","nas"]') || 'ubuntu-24.04' }}
    environment: ${{ inputs.instanz || 'dv-trier' }}
    env:
      KLUFT_INSTANZ: ${{ inputs.instanz || 'dv-trier' }}
      PHP_BIN: ${{ vars.PHP_BIN || secrets.PHP_BIN || '/usr/bin/php' }}
      NUR_PRUEFEN: ${{ inputs.nur_pruefen && 'true' || 'false' }}
      # setup-php auf einem eigenen Runner (installiert PHP dann per apt).
      runner: ${{ inputs.runner == 'nas' && 'self-hosted' || '' }}
      # MariaDB für die Tests; auf dem NAS ein anderer Port, falls dort schon eine läuft.
      TEST_DB_PORT: ${{ inputs.runner == 'nas' && '33306' || '3306' }}
    # Produktiv läuft MariaDB – die Tests laufen daher zusätzlich dagegen
    # (SQLite prüft z. B. keine Spaltenlängen).
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: dpsg_test
          MARIADB_USER: dpsg
          MARIADB_PASSWORD: dpsg
          MARIADB_ROOT_PASSWORD: root
        ports:
          - ${{ inputs.runner == 'nas' && '33306' || '3306' }}:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, gd, zip, xml, curl, openssl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Composer-Cache finden
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Composer-Cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # Volle Installation (inkl. Dev-Abhängigkeiten) für die Tests.
      - name: PHP-Abhängigkeiten installieren (für Tests)
        run: composer install --no-interaction --no-progress

      # Muss VOR "Tests ausführen" laufen: Views nutzen @vite(), das ohne
      # public/build/manifest.json (erst durch diesen Schritt erzeugt)
      # mit "Vite manifest not found" fehlschlägt, sobald ein Test eine
      # Seite über die Route rendert.
      - name: Frontend-Assets bauen
        run: |
          npm ci
          npm run build

      # Logo, Favicon und Bilder der Instanz nach public/instanz.
      - name: Bilder der Instanz bereitstellen
        run: |
          cp -n .env.example .env
          php artisan key:generate --no-interaction --force
          php artisan kluft:assets

      # Ist „Qualität und Sicherheit“ für genau diesen Commit schon grün
      # (Tests aller Instanzen mit SQLite), entfällt der SQLite-Lauf hier.
      # Gegen MariaDB wird immer getestet – das prüft die CI sonst nicht.
      - name: Qualität für diesen Stand schon grün?
        id: qualitaet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # curl statt gh: läuft auch auf dem eigenen Runner ohne gh.
          n=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" \
            | jq -r '.total_count' 2>/dev/null || echo 0)
          echo "gruen=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Qualität für $GITHUB_SHA grün: $([ "${n:-0}" -gt 0 ] && echo ja || echo nein)"

      - name: Tests ausführen
        if: steps.qualitaet.outputs.gruen != 'true'
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          touch database/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          php artisan test

      - name: Tests gegen MariaDB ausführen
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ env.TEST_DB_PORT }}
          DB_DATABASE: dpsg_test
          DB_USERNAME: dpsg
          DB_PASSWORD: dpsg
        run: php artisan test

      # Für das Deployment: nur Produktions-Abhängigkeiten, dann zu einem
      # einzelnen Archiv packen (s. Kommentar oben).
      - name: PHP-Produktionsabhängigkeiten installieren und packen
        run: |
          rm -rf vendor
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          tar czf vendor-bundle.tar.gz vendor

      - name: .env der Instanz erzeugen
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          APP_ENV_VALUE: ${{ vars.APP_ENV || secrets.APP_ENV || 'local' }}
          APP_NAME_VAR: ${{ vars.APP_NAME || secrets.APP_NAME }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS || secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME_VAR: ${{ vars.MAIL_FROM_NAME || secrets.MAIL_FROM_NAME }}
          MITGLIEDER_DRIVER: ${{ secrets.MITGLIEDER_DRIVER }}
          NAMI_AUTH: ${{ secrets.NAMI_AUTH }}
          NAMI_USER: ${{ secrets.NAMI_USER }}
          NAMI_PASSWORD: ${{ secrets.NAMI_PASSWORD }}
          HITOBITO_URL: ${{ secrets.HITOBITO_URL }}
          HITOBITO_TOKEN: ${{ secrets.HITOBITO_TOKEN }}
          HITOBITO_MEMBER_NUMBER_ATTRIBUTE: ${{ secrets.HITOBITO_MEMBER_NUMBER_ATTRIBUTE }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ENTRA_CLIENT_ID: ${{ secrets.ENTRA_CLIENT_ID }}
          ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_NEWSLETTER_LIST_ID: ${{ secrets.BREVO_NEWSLETTER_LIST_ID }}
          BREVO_DOI_TEMPLATE_ID: ${{ secrets.BREVO_DOI_TEMPLATE_ID }}
          NEXTCLOUD_ALLOWED_HOSTS: ${{ secrets.NEXTCLOUD_ALLOWED_HOSTS }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          MAIL_TEST_REDIRECT_TO: ${{ secrets.MAIL_TEST_REDIRECT_TO }}
          # Testphase: bis zu 5 Adressen (kommagetrennt), die ihre Mails trotz
          # Umleitung direkt bekommen.
          MAIL_TEST_ALLOWLIST: ${{ secrets.MAIL_TEST_ALLOWLIST }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
          BACKUP_WEBDAV_URL: ${{ secrets.BACKUP_WEBDAV_URL }}
          BACKUP_WEBDAV_USER: ${{ secrets.BACKUP_WEBDAV_USER }}
          BACKUP_WEBDAV_PASSWORD: ${{ secrets.BACKUP_WEBDAV_PASSWORD }}
          # Optional: eigener ntfy-Server statt ntfy.sh (Push-Nachrichten).
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # WhatsApp-Newsletter: in der Testumgebung nur an diese Nummern senden.
          WHATSAPP_TEST_ALLOWLIST: ${{ secrets.WHATSAPP_TEST_ALLOWLIST }}
          # Variante einschalten: off (Standard) | channel | api.
          WHATSAPP_MODE: ${{ secrets.WHATSAPP_MODE }}
          WHATSAPP_CHANNEL_URL: ${{ secrets.WHATSAPP_CHANNEL_URL }}
        run: |
          trim() {
            local var="$1"
            var="${var#"${var%%[![:space:]]*}"}"
            var="${var%"${var##*[![:space:]]}"}"
            printf '%s' "$var"
          }
          APP_URL="$(trim "$APP_URL")"; APP_URL="${APP_URL%/}"
          MAIL_FROM_ADDRESS="$(trim "$MAIL_FROM_ADDRESS")"
          if [ -z "$APP_URL" ] || [ -z "$MAIL_FROM_ADDRESS" ]; then
            # Beim reinen Prüfen trotzdem SSH und Datenbank testen.
            if [ "$NUR_PRUEFEN" = "true" ]; then
              echo "::warning::Im Environment ${KLUFT_INSTANZ} fehlen die Variablen APP_URL und/oder MAIL_FROM_ADDRESS (Settings → Environments) – vor dem Deploy eintragen."
              APP_URL="${APP_URL:-https://example.invalid}"
              MAIL_FROM_ADDRESS="${MAIL_FROM_ADDRESS:-noreply@example.invalid}"
            else
              echo "::error::Im Environment ${KLUFT_INSTANZ} fehlen die Variablen APP_URL und/oder MAIL_FROM_ADDRESS (Settings → Environments)."
              exit 1
            fi
          fi
          # Name und Newsletter-Adresse aus der Instanz-Konfiguration.
          # Mit Autoloader: Stammes-Instanzen bauen ihre Konfiguration mit StammVorlage.
          CFG='require "vendor/autoload.php"; $c = require "config/dpsg.php";'
          SITE_NAME="$(php -r "$CFG"' echo $c["site"]["name"];')"
          NEWSLETTER_SLUG="$(php -r "$CFG"' echo $c["newsletter"]["slug"] ?? "";')"
          APP_NAME="${APP_NAME_VAR:-$SITE_NAME}"
          MAIL_FROM_NAME="${MAIL_FROM_NAME_VAR:-$SITE_NAME}"
          if [ -n "$NEWSLETTER_SLUG" ]; then DOI_URL="${APP_URL}/${NEWSLETTER_SLUG}/danke"; else DOI_URL=""; fi
          # MariaDB, sobald die Zugangsdaten als Secrets vorliegen. Werte in
          # einfachen Anführungszeichen: dort ersetzt dotenv nichts (z. B. $).
          if [ -n "$(trim "$DB_HOST")" ] && [ -n "$(trim "$DB_DATABASE")" ]; then
            for value in "$DB_HOST" "$DB_PORT" "$DB_DATABASE" "$DB_USERNAME" "$DB_PASSWORD"; do
              case "$value" in *"'"*) echo "::error::Ein DB_*-Secret enthält ein einfaches Anführungszeichen – bitte ein anderes Passwort wählen."; exit 1 ;; esac
            done
            DB_BLOCK="DB_CONNECTION=mariadb
          DB_HOST='$(trim "$DB_HOST")'
          DB_PORT='$(trim "${DB_PORT:-3306}")'
          DB_DATABASE='$(trim "$DB_DATABASE")'
          DB_USERNAME='$(trim "$DB_USERNAME")'
          DB_PASSWORD='$(trim "$DB_PASSWORD")'"
          else
            DB_BLOCK="DB_CONNECTION=sqlite"
          fi
          # Echte Mails nur mit Brevo-SMTP-Zugang UND Test-Umleitung
          # (F-MAIL-06): in der Testphase bekommt niemand außer der
          # Testadresse Post. Sonst landen Mails nur im Log.
          if [ -n "$BREVO_SMTP_LOGIN" ] && [ -n "$BREVO_SMTP_KEY" ] && [ -n "$MAIL_TEST_REDIRECT_TO" ]; then
            MAIL_MAILER=smtp
          else
            MAIL_MAILER=log
          fi
          # Platzhalter: der echte, dauerhafte Schlüssel wird erst auf dem
          # Server eingesetzt (s. "vendor/ auf dem Server entpacken").
          APP_KEY="base64:$(openssl rand -base64 32)"
          # Als .env.deploy hochladen, NICHT als .env: Die laufende .env
          # (mit dem dauerhaften APP_KEY) bleibt während des Uploads
          # unangetastet und wird erst danach in einem Schritt ersetzt.
          # Sonst liefe die Seite minutenlang mit einem fremden Schlüssel –
          # alle Sitzungen ungültig, neu Verschlüsseltes später unlesbar.
          cat > .env.deploy <<ENV
          KLUFT_INSTANZ=${KLUFT_INSTANZ}
          KLUFT_REVISION=${GITHUB_SHA}
          KLUFT_REPOSITORY_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          APP_NAME="${APP_NAME}"
          APP_ENV=${APP_ENV_VALUE}
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=${APP_URL}
          APP_LOCALE=de
          APP_FALLBACK_LOCALE=de
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=error
          ${DB_BLOCK}
          SESSION_DRIVER=file
          SESSION_LIFETIME=480
          CACHE_STORE=file
          QUEUE_CONNECTION=database
          ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
          ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
          ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
          ENTRA_REDIRECT_URI=${APP_URL}/auth/entra/callback
          BREVO_API_KEY=${BREVO_API_KEY}
          BREVO_NEWSLETTER_LIST_ID=${BREVO_NEWSLETTER_LIST_ID}
          BREVO_DOI_TEMPLATE_ID=${BREVO_DOI_TEMPLATE_ID}
          BREVO_DOI_REDIRECT_URL=${DOI_URL}
          NEXTCLOUD_ALLOWED_HOSTS=${NEXTCLOUD_ALLOWED_HOSTS}
          MAIL_MAILER=${MAIL_MAILER}
          MAIL_SCHEME=smtp
          MAIL_HOST=smtp-relay.brevo.com
          MAIL_PORT=587
          MAIL_USERNAME="${BREVO_SMTP_LOGIN}"
          MAIL_PASSWORD="${BREVO_SMTP_KEY}"
          MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
          MAIL_FROM_NAME="${MAIL_FROM_NAME}"
          MAIL_TEST_REDIRECT_TO=${MAIL_TEST_REDIRECT_TO}
          MAIL_TEST_ALLOWLIST="$(printf '%s' "$MAIL_TEST_ALLOWLIST" | tr '\r\n' ',,' | tr -d '" ')"
          BACKUP_PASSWORD="${BACKUP_PASSWORD}"
          BACKUP_WEBDAV_URL=${BACKUP_WEBDAV_URL}
          BACKUP_WEBDAV_USER="${BACKUP_WEBDAV_USER}"
          BACKUP_WEBDAV_PASSWORD="${BACKUP_WEBDAV_PASSWORD}"
          NTFY_SERVER=${NTFY_SERVER}
          NTFY_TOKEN="${NTFY_TOKEN}"
          WHATSAPP_TEST_ALLOWLIST="$(printf '%s' "$WHATSAPP_TEST_ALLOWLIST" | tr '\r\n' ',,' | tr -d '"')"
          WHATSAPP_MODE=$(trim "${WHATSAPP_MODE:-off}")
          WHATSAPP_CHANNEL_URL=$(trim "$WHATSAPP_CHANNEL_URL")
          MITGLIEDER_DRIVER=$(trim "${MITGLIEDER_DRIVER:-off}")
          NAMI_AUTH=$(trim "$NAMI_AUTH")
          NAMI_USER="${NAMI_USER}"
          NAMI_PASSWORD="${NAMI_PASSWORD}"
          HITOBITO_URL=$(trim "$HITOBITO_URL")
          HITOBITO_TOKEN="${HITOBITO_TOKEN}"
          HITOBITO_MEMBER_NUMBER_ATTRIBUTE=$(trim "$HITOBITO_MEMBER_NUMBER_ATTRIBUTE")
          ENV

      # Selbstgehostete Kartendaten (F-MAP-04, ~140 MB) – zu groß fürs
      # Repository. Werden aus dem Protomaps-Tagesbuild ausgeschnitten und
      # gecacht; der Dateiname enthält das Build-Datum aus config/dpsg.php.
      # Cache-Schlüssel hängt nur an den Karteneinstellungen, nicht an der
      # ganzen config/dpsg.php – sonst baut jede Config-Änderung 140 MB neu.
      - name: Kartendaten-Schlüssel bestimmen
        id: mapkey
        run: |
          MAP_PHP='require "vendor/autoload.php"; if (! function_exists("env")) { function env($k, $d = null) { $v = getenv($k); return $v === false ? $d : $v; } } $m = (require "config/dpsg.php")["map"];'
          PMTILES="$(php -r "$MAP_PHP"' echo $m["pmtiles"] ?? "";')"
          mkdir -p public/maps/data
          # Stämme haben (noch) keine eigene Kartendatei – dann nichts bauen.
          if [ -z "$PMTILES" ]; then echo "needed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "key=map-data-${KLUFT_INSTANZ}-$(php -r "$MAP_PHP"' echo $m["build"], "-", substr(md5(json_encode($m)), 0, 12);')" >> "$GITHUB_OUTPUT"
          echo "file=public/$PMTILES" >> "$GITHUB_OUTPUT"

      - name: Kartendaten aus dem Cache holen
        id: mapcache
        if: steps.mapkey.outputs.needed == 'true'
        uses: actions/cache@v5
        with:
          path: public/maps/data
          key: ${{ steps.mapkey.outputs.key }}
          # Fallback auf den letzten Stand: liegt die passende Datei schon
          # darin, entfällt der Neuaufbau.
          restore-keys: map-data-${{ inputs.instanz || 'dv-trier' }}-

      - name: Kartendatei vorhanden?
        id: mapfile
        run: |
          if [ "${{ steps.mapkey.outputs.needed }}" != "true" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Nur die Karte dieser Instanz hochladen (ältere Builds aussortieren).
          find public/maps/data -type f ! -path "${{ steps.mapkey.outputs.file }}" -delete 2>/dev/null || true
          if [ -f "${{ steps.mapkey.outputs.file }}" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Go einrichten (für go-pmtiles)
        if: steps.mapfile.outputs.exists != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Kartendaten erzeugen
        if: steps.mapfile.outputs.exists != 'true'
        run: |
          go install github.com/protomaps/go-pmtiles@v1.31.2
          scripts/build-map-data.sh "$(go env GOPATH)/bin/go-pmtiles"

      - name: lftp installieren
        run: command -v lftp >/dev/null || { sudo apt-get update && sudo apt-get install -y lftp; }

      # lftp meldet "hostname contains invalid characters", wenn im Secret
      # unsichtbare Zeichen stecken (typischerweise ein Windows-Zeilenende
      # \r oder ein Leerzeichen aus Copy&Paste). Dieser Schritt entfernt
      # führende/folgende Leerraumzeichen aus den Secrets, bevor sie
      # verwendet werden, und schreibt die bereinigten Werte in $GITHUB_ENV
      # (nicht ins Log) – für alle folgenden Schritte des Jobs.
      - name: Secrets bereinigen (führende/folgende Leerzeichen, CRLF)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.SSH_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.SSH_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || secrets.SSH_TARGET_DIR }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR || secrets.FTP_SERVER_DIR }}
        run: |
          trim() {
            local var="$1"
            var="${var#"${var%%[![:space:]]*}"}"
            var="${var%"${var##*[![:space:]]}"}"
            printf '%s' "$var"
          }
          {
            echo "FTP_SERVER=$(trim "$FTP_SERVER")"
            echo "FTP_USERNAME=$(trim "$FTP_USERNAME")"
            echo "FTP_PASSWORD=$(trim "$FTP_PASSWORD")"
            echo "FTP_SERVER_DIR=$(trim "$FTP_SERVER_DIR")"
            echo "SSH_HOST=$(trim "$SSH_HOST")"
            echo "SSH_PORT=$(trim "${SSH_PORT:-22}")"
            echo "SSH_USERNAME=$(trim "$SSH_USERNAME")"
            echo "SSH_TARGET_DIR=$(trim "$SSH_TARGET_DIR")"
          } >> "$GITHUB_ENV"
          # DB-Zugang aus der erzeugten .env.deploy für die Verbindungsprobe auf dem
          # Server (base64, damit Sonderzeichen heil ankommen; maskiert).
          DB_PRUEF=$(grep -E "^DB_(HOST|PORT|DATABASE|USERNAME|PASSWORD)=" .env.deploy | base64 -w0 || true)
          if [ -n "$DB_PRUEF" ]; then
            echo "::add-mask::$DB_PRUEF"
            echo "DB_PRUEF=$DB_PRUEF" >> "$GITHUB_ENV"
          fi

      # „Nur prüfen“ (und vor jedem echten Deploy): Zugang, PHP und Ziel.
      - name: Server prüfen (per SSH, ändert nichts)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PRUEF
          script: |
            set -e
            echo "Instanz: ${{ env.KLUFT_INSTANZ }}"
            "${{ env.PHP_BIN }}" -r 'echo "PHP ", PHP_VERSION, PHP_EOL; foreach (["intl","mbstring","gd","zip","xml","curl","pdo_mysql","pdo_sqlite","openssl","sodium"] as $e) { echo str_pad($e, 11), extension_loaded($e) ? "ja" : "FEHLT", PHP_EOL; }'
            "${{ env.PHP_BIN }}" -r 'exit(version_compare(PHP_VERSION, "8.3.0", ">=") ? 0 : 1);' || { echo "::error::PHP 8.3 oder neuer nötig"; exit 1; }
            # Verbindungsprobe vom Server aus (dort ist die DB meist nur lokal
            # erreichbar). Zeigt Version und Tabellenzahl, nie die Zugangsdaten.
            db_probe() {
              [ -n "${DB_PRUEF:-}" ] || return 0
              "${{ env.PHP_BIN }}" -r '
                $e = [];
                foreach (explode("\n", trim(base64_decode(getenv("DB_PRUEF")))) as $z) { [$k, $v] = explode("=", $z, 2); $e[$k] = trim($v, "\x27"); }
                try {
                    $pdo = new PDO("mysql:host={$e["DB_HOST"]};port={$e["DB_PORT"]};dbname={$e["DB_DATABASE"]};charset=utf8mb4", $e["DB_USERNAME"], $e["DB_PASSWORD"], [PDO::ATTR_TIMEOUT => 10, PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
                    $tabellen = $pdo->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE()")->fetchColumn();
                    echo "Datenbank-Verbindung: ok (", $pdo->query("SELECT VERSION()")->fetchColumn(), ", ", $tabellen, " Tabellen)", PHP_EOL;
                } catch (Throwable $x) {
                    echo "::error::Datenbank-Verbindung fehlgeschlagen: ", $x->getMessage(), PHP_EOL;
                    exit(1);
                }'
            }
            if [ ! -d "${{ env.SSH_TARGET_DIR }}" ]; then
              # Hilfe beim Eintragen: was es unter dem Anmeldeordner gibt.
              echo "::error::Zielordner fehlt (Secret SSH_TARGET_DIR)."
              echo "Anmeldeordner: $HOME – darin:"
              ls -1p "$HOME" 2>/dev/null | head -n 40 || true
              eltern=$(dirname "${{ env.SSH_TARGET_DIR }}")
              if [ -d "$eltern" ]; then echo "Übergeordneter Ordner vorhanden, darin:"; ls -1p "$eltern" | head -n 40; fi
              db_probe || true
              exit 1
            fi
            test -w "${{ env.SSH_TARGET_DIR }}" || { echo "::error::Zielordner nicht beschreibbar"; exit 1; }
            cd "${{ env.SSH_TARGET_DIR }}"
            echo "Freier Speicher: $("${{ env.PHP_BIN }}" -r 'echo round(disk_free_space(".") / 1024 / 1024 / 1024, 1), " GB";')"
            # Schutz: Läuft der Server mit MariaDB, im Environment fehlen aber
            # DB_HOST/DB_DATABASE, würde die neue .env auf SQLite umstellen.
            DB_NEU="${{ (secrets.DB_HOST != '' && secrets.DB_DATABASE != '') && 'mariadb' || 'sqlite' }}"
            if [ -f .env ]; then
              DB_JETZT=$(grep -m1 '^DB_CONNECTION=' .env | cut -d= -f2- | tr -d "'\" ")
              DB_JETZT=${DB_JETZT:-sqlite}
              echo "Datenbank: jetzt $DB_JETZT, nach dem Deploy $DB_NEU"
              if [ "$DB_JETZT" != "sqlite" ] && [ "$DB_NEU" = "sqlite" ]; then
                echo "::error::Auf dem Server läuft $DB_JETZT, im Environment fehlen die Secrets DB_HOST/DB_DATABASE. Ein Deploy würde auf SQLite umstellen – abgebrochen."
                exit 1
              fi
            else
              echo "Datenbank nach dem Deploy: $DB_NEU"
            fi
            db_probe
            if [ -f artisan ] && [ -f vendor/autoload.php ]; then
              echo "Installiert: $("${{ env.PHP_BIN }}" artisan --version 2>/dev/null)"
              grep -m1 '^KLUFT_INSTANZ=' .env 2>/dev/null || echo "KLUFT_INSTANZ in .env: (noch nicht gesetzt – bisheriger Stand vor Kluft)"
              # Schutz: Liegt hier schon eine andere Instanz (gleicher Server,
              # falscher SSH_TARGET_DIR), würde der Deploy sie überschreiben.
              INSTANZ_JETZT=$(grep -m1 '^KLUFT_INSTANZ=' .env 2>/dev/null | cut -d= -f2- | tr -d "'\" " || true)
              if [ -n "$INSTANZ_JETZT" ] && [ "$INSTANZ_JETZT" != "${{ env.KLUFT_INSTANZ }}" ]; then
                echo "::error::Im Zielordner läuft die Instanz $INSTANZ_JETZT, nicht ${{ env.KLUFT_INSTANZ }} – SSH_TARGET_DIR prüfen. Abgebrochen."
                exit 1
              fi
              "${{ env.PHP_BIN }}" artisan migrate:status --pending 2>/dev/null | tail -n 5 || true
              # Letzte Fehler aus dem Laravel-Log (nur die Kopfzeilen, gekürzt).
              if [ -f storage/logs/laravel.log ]; then
                echo "Letzte Fehler im Log:"
                grep -E '^\[[0-9-]+ [0-9:]+\] [a-z]+\.(ERROR|CRITICAL|ALERT|EMERGENCY):' storage/logs/laravel.log | tail -n 3 | cut -c1-400 || true
              fi
            else
              # Schutz: mirror --delete würde eine vorhandene Website löschen.
              # Erst-Deploy nur in einen leeren Ordner.
              vorhanden=$(ls -A | grep -v -x -e '.well-known' -e 'cgi-bin' || true)
              if [ -n "$vorhanden" ]; then
                echo "Im Zielordner liegt schon etwas (kein Kluft):"
                echo "$vorhanden" | head -n 20
                echo "::error::Zielordner ist nicht leer. Der erste Deploy würde diese Dateien löschen – bitte sichern und den Ordner leeren (oder einen anderen wählen)."
                exit 1
              fi
              echo "Noch keine Installation, Ordner leer – der erste Deploy legt alles an."
            fi

      # APP_KEY muss über Deploys hinweg gleich bleiben: Er verschlüsselt
      # Sitzungen und das TOTP-Geheimnis des Notfall-Logins. Vor dem Upload
      # (der die .env ersetzt) wird der bisherige Schlüssel einmalig nach
      # storage/app/private/app.key gesichert (vom Mirror ausgenommen,
      # per .htaccess nicht abrufbar); danach wird nur noch dieser verwendet.
      - name: APP_KEY auf dem Server sichern (per SSH)
        if: env.NUR_PRUEFEN != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ env.SSH_TARGET_DIR }}"
            mkdir -p storage/app/private
            if [ ! -s storage/app/private/app.key ] && [ -f .env ]; then
              grep '^APP_KEY=base64:' .env | head -n1 | cut -d= -f2- > storage/app/private/app.key || true
            fi
            if [ -f storage/app/private/app.key ]; then chmod 600 storage/app/private/app.key; fi
            # Wartungsmodus für die Dauer des Uploads: Besucher sehen eine
            # 503-Seite statt 500er durch halb hochgeladene Dateien.
            if [ -f vendor/autoload.php ] && [ -f .env ]; then "${{ env.PHP_BIN }}" artisan down --retry=60 --render="errors::503" || true; fi

      # Angaben anderer Instanzen (z. B. Namen aus deren angaben.json) gehören
      # nicht auf diesen Server. Ordner vor dem Spiegeln entfernen – dann
      # löscht „mirror --delete“ dort auch frühere Reste.
      - name: Nur die eigene Instanz hochladen
        if: env.NUR_PRUEFEN != 'true'
        run: |
          [ -d "instanzen/$KLUFT_INSTANZ" ] || { echo "::error::instanzen/$KLUFT_INSTANZ fehlt"; exit 1; }
          find instanzen -mindepth 1 -maxdepth 1 -type d ! -name "$KLUFT_INSTANZ" -print -exec rm -rf {} +

      - name: Per lftp über SFTP synchronisieren (inkl. Löschen entfernter Dateien)
        if: env.NUR_PRUEFEN != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Ohne FTP_PASSWORD (z. B. vServer): SFTP mit dem SSH-Schlüssel.
          SFTP_PORT=22
          CONNECT=""
          if [ -z "$FTP_PASSWORD" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SFTP_PORT="$SSH_PORT"
            CONNECT="set sftp:connect-program \"ssh -a -x -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new\""
          fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$SFTP_PORT" "sftp://$FTP_SERVER" <<EOF
          $CONNECT
          set sftp:auto-confirm yes
          set net:max-retries 2
          set mirror:parallel-transfer-count 3
          # Erst unter temporärem Namen hochladen, dann umbenennen: jede Datei
          # (auch .htaccess) wird atomar ausgetauscht, nie halb geschrieben.
          set xfer:use-temp-file yes
          mirror --reverse --delete --verbose \
            --exclude '^\.git/' \
            --exclude '^\.github/' \
            --exclude '^\.claude/' \
            --exclude '^node_modules/' \
            --exclude '^vendor/' \
            --exclude '^tests/' \
            --exclude '^docs/' \
            --exclude '^legacy-static-site/' \
            --exclude '^runner/' \
            --exclude-glob .env.example \
            --exclude-glob .env \
            --exclude-glob .gitattributes \
            --exclude-glob .editorconfig \
            --exclude-glob database/database.sqlite \
            --exclude-glob storage/app/private/ \
            --exclude-glob storage/logs/ \
            --exclude-glob storage/framework/sessions/ \
            --exclude-glob storage/framework/cache/ \
            --exclude-glob storage/framework/down \
            --exclude-glob storage/framework/maintenance.php \
            --exclude-glob public/uploads/ \
            --exclude-glob public/maps/data/ \
            ./ "$FTP_SERVER_DIR"
          mirror --reverse --ignore-time --verbose public/maps/data "$FTP_SERVER_DIR/public/maps/data"
          bye
          EOF

      # vendor/ auf dem Server entpacken (überschreibt eine evtl. vorhandene
      # alte Version). Volle Pfade zu php/tar, da PATH in nicht-interaktiven
      # SSH-Sessions auf diesem Hosting eingeschränkt ist (composer selbst
      # ist hier gar nicht per SSH aufrufbar, s. Kommentar oben – daher das
      # Archiv statt composer install).
      #
      # BEWUSST OHNE artisan config:cache/route:cache/view:cache: SSH_TARGET_DIR
      # zeigt hier auf einen praktischen Kurzpfad (z. B. /meine-domain.de/httpdocs),
      # der auf diesem Hosting per Symlink auf den echten Pfad
      # (/var/www/vhosts/<konto>/<domain>/httpdocs) verweist. Laravel cacht
      # aber den Pfad, unter dem es beim Cache-Aufbau lief – und der echte
      # Webserver-Prozess (mod_fcgid) sieht NUR den echten Pfad (open_basedir
      # ist darauf beschränkt). Mit dem Kurzpfad gecachte Config/Routen/Views
      # lassen jeden Request mit "open_basedir restriction in effect" abstürzen.
      # Laravel funktioniert auch ungecacht einwandfrei (Pfade werden dann bei
      # jedem Request live und korrekt aufgelöst) – nur etwas langsamer.
      # Caching sauber nachrüsten: SSH_TARGET_DIR auf den ECHTEN absoluten
      # Pfad setzen (z. B. /var/www/vhosts/<konto>/<domain>/httpdocs, siehe
      # Pfade in storage/logs bzw. den Apache-Fehlerprotokollen) und die drei
      # artisan-*:cache-Zeilen wieder ergänzen.
      - name: vendor/ auf dem Server entpacken (per SSH)
        if: env.NUR_PRUEFEN != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ env.SSH_TARGET_DIR }}"
            rm -rf vendor
            tar xzf vendor-bundle.tar.gz
            rm -f vendor-bundle.tar.gz
            rm -f bootstrap/cache/config.php bootstrap/cache/routes-v7.php bootstrap/cache/services.php bootstrap/cache/packages.php
            rm -f storage/framework/views/*.php
            # Gesicherten APP_KEY einsetzen (beim allerersten Mal erzeugen).
            if [ ! -s storage/app/private/app.key ]; then
              "${{ env.PHP_BIN }}" -r 'echo "base64:".base64_encode(random_bytes(32));' > storage/app/private/app.key
              chmod 600 storage/app/private/app.key
            fi
            APP_KEY_VALUE="$(cat storage/app/private/app.key)"
            # Neue Konfiguration mit dem dauerhaften Schlüssel versehen und
            # atomar an die Stelle der alten .env setzen.
            sed -i "s#^APP_KEY=.*#APP_KEY=${APP_KEY_VALUE}#" .env.deploy
            chmod 640 .env.deploy
            mv -f .env.deploy .env
            # Mediathek-Uploads liegen in public/uploads (vom Mirror
            # ausgeschlossen); /storage/ ist per Root-.htaccess gesperrt.
            # Reste früherer Versuche (Symlink/leeres Verzeichnis) entfernen.
            if [ -L public/storage ]; then rm public/storage; fi
            rmdir public/storage/media public/storage 2>/dev/null || true
            mkdir -p public/uploads/media
            # Laufzeitordner, die der Mirror bewusst nicht anfasst – bei einer
            # Erstinstallation fehlen sie sonst (500er beim Speichern der Sitzung).
            mkdir -p storage/framework/sessions storage/framework/cache/data storage/framework/views storage/logs bootstrap/cache
            printf '%s\n' '<FilesMatch "\.(php|phtml|phar|phps|php[0-9])$">' '    Require all denied' '</FilesMatch>' > public/uploads/.htaccess
            # database/database.sqlite ist vom Mirror oben bewusst
            # ausgeschlossen (sonst würde jeder Deploy alle über das
            # Admin-Panel angelegten Inhalte löschen). migrate --force ist
            # idempotent und läuft daher immer (hält das Schema aktuell);
            # db:seed nur beim allerersten Mal, da der Seeder die Pflicht-
            # seiten per updateOrCreate zurücksetzen würde und damit
            # spätere redaktionelle Änderungen an Impressum & Co.
            # überschreiben könnte. Für Fälle wie "neuer Seeder auf
            # bereits bestehender DB nachträglich ausführen" steht der
            # workflow_dispatch-Input "force_seed" (Run workflow im
            # Actions-Tab) zur Verfügung.
            use_sqlite() {
              sed -i -E '/^DB_(HOST|PORT|DATABASE|USERNAME|PASSWORD)=/d; s/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
            }
            NEEDS_SEED=0
            DB_FAILED=0
            MARKER=storage/app/private/mariadb-initialized
            if grep -q '^DB_CONNECTION=mariadb' .env; then
              if ! "${{ env.PHP_BIN }}" artisan db:check; then
                echo "::error::MariaDB nicht erreichbar – die Seite läuft weiter mit SQLite."
                use_sqlite
                DB_FAILED=1
              fi
            fi
            if grep -q '^DB_CONNECTION=mariadb' .env; then
              if [ ! -f "$MARKER" ] && [ -f database/database.sqlite ]; then
                # Einmaliger Umzug: erst die SQLite-Datei auf den neuesten
                # Stand bringen (auch Daten-Migrationen dieses Deploys),
                # dann das Schema in MariaDB anlegen und alles kopieren.
                # Echte Umgebungsvariablen haben Vorrang vor der .env.
                echo "---- Umzug SQLite → MariaDB ----"
                # Mit && verkettet: bricht ein Schritt ab, greift der
                # Rückfall auf SQLite (set -e gilt in if-Bedingungen nicht).
                if DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/database.sqlite" "${{ env.PHP_BIN }}" artisan migrate --force \
                  && "${{ env.PHP_BIN }}" artisan migrate --force \
                  && "${{ env.PHP_BIN }}" artisan db:copy-from-sqlite --force; then
                  date -u +%FT%TZ > "$MARKER"
                  "${{ env.PHP_BIN }}" artisan cache:clear || true
                  echo "Umzug abgeschlossen; database/database.sqlite bleibt als Sicherung liegen."
                else
                  echo "::error::Übernahme der Inhalte nach MariaDB fehlgeschlagen – die Seite läuft weiter mit SQLite."
                  use_sqlite
                  DB_FAILED=1
                fi
              else
                "${{ env.PHP_BIN }}" artisan migrate --force
                if [ ! -f "$MARKER" ]; then
                  NEEDS_SEED=1
                  date -u +%FT%TZ > "$MARKER"
                fi
              fi
            fi
            if grep -q '^DB_CONNECTION=sqlite' .env; then
              if [ ! -f database/database.sqlite ]; then
                touch database/database.sqlite
                NEEDS_SEED=1
              fi
              "${{ env.PHP_BIN }}" artisan migrate --force
            fi
            if [ "$NEEDS_SEED" = "1" ] || [ "${{ github.event.inputs.force_seed }}" = "true" ]; then
              "${{ env.PHP_BIN }}" artisan db:seed --force
            fi
            echo "Datenbank: $(grep -m1 '^DB_CONNECTION=' .env | cut -d= -f2)"
            # Diagnose ohne SSH-Zugang: die letzten Fehlermeldungen aus dem
            # Laravel-Log (nur die Meldungszeile, gekürzt, E-Mail-Adressen und
            # IPs geschwärzt) im Actions-Protokoll anzeigen.
            # WebP-Varianten für Bilder ohne Varianten nachziehen (F-CMS-04).
            "${{ env.PHP_BIN }}" artisan media:variants || true
            "${{ env.PHP_BIN }}" artisan up
            echo "---- PHP-Fähigkeiten auf dem Server ----"
            "${{ env.PHP_BIN }}" -r 'echo "PHP ", PHP_VERSION, " | GD: ", function_exists("imagecreatefromstring") ? "ja" : "NEIN", " | WebP: ", function_exists("imagewebp") ? "ja" : "NEIN", " | Zip: ", class_exists("ZipArchive") ? "ja" : "NEIN", " | Sodium: ", function_exists("sodium_crypto_secretstream_xchacha20poly1305_init_push") ? "ja" : "NEIN", " | proc_open: ", function_exists("proc_open") ? "ja" : "NEIN", "\n";'
            command -v mysqldump >/dev/null && echo "mysqldump: vorhanden" || echo "mysqldump: fehlt"
            echo "---- Letzte Fehler im Laravel-Log ----"
            grep -h '\.\(ERROR\|CRITICAL\|ALERT\|EMERGENCY\):' storage/logs/laravel*.log 2>/dev/null \
              | tail -n 15 | cut -c1-400 \
              | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g; s/([0-9]{1,3}\.){3}[0-9]{1,3}/<ip>/g' \
              || echo "(keine)"
            if [ "$DB_FAILED" = "1" ]; then exit 1; fi

      # Falls ein Schritt oben fehlschlägt, darf die Seite nicht im
      # Wartungsmodus hängen bleiben.
      - name: Wartungsmodus sicher beenden
        # Nur wenn die Server-Zugangsdaten schon geladen wurden.
        if: always() && env.SSH_HOST != '' && env.NUR_PRUEFEN != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd "${{ env.SSH_TARGET_DIR }}"
            if [ -f storage/framework/down ]; then
              "${{ env.PHP_BIN }}" artisan up || rm -f storage/framework/down storage/framework/maintenance.php
            fi

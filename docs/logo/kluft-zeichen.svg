<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Kluft</title>
  <style>.g{stroke:#1f5a47}.t{fill:#9cc7b3}.w{fill:#1f5a47}@media (prefers-color-scheme:dark){.g{stroke:#4f9f80}.t{fill:#2c5546}.w{fill:#eef3ef}}</style>
  <!-- Halstuch: das Tuch im Nacken … -->
  <path class="t" d="M10 9 Q32 4 54 9 Q45 23 32 30 Q19 23 10 9 Z"/>
  <!-- … und zwei Enden laufen durch den Knoten und hängen herab -->
  <g class="g" fill="none" stroke-width="7.5" stroke-linecap="round">
    <path d="M10 9 Q19 23 31 30"/>
    <path d="M54 9 Q45 23 33 30"/>
    <path d="M29.5 34 L24 57"/>
    <path d="M34.5 34 L40 57"/>
  </g>
  <!-- Knoten: hält das Halstuch zusammen, verbindet die Gliederungen -->
  <circle cx="32" cy="31" r="7" fill="none" stroke="#e8a92a" stroke-width="5"/>
</svg>

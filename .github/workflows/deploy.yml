name: Deploy auf Netcup-Webspace

# Baut das Laravel-Custom-CMS (Pflichtenheft docs/pflichtenheft.md) und lädt
# es bei jedem Push auf diesen Branch automatisch per SFTP auf den Webspace
# hoch. Kann zusätzlich manuell über den "Actions"-Tab in GitHub gestartet
# werden (Run workflow).
#
# Wichtig: lftp "mirror --reverse --delete" spiegelt den Webspace also exakt
# auf den Stand dieses Branches – Dateien, die hier gelöscht wurden,
# verschwinden dadurch auch auf dem Server. Das ersetzt den früheren
# statischen Entwurf vollständig (der bleibt als Referenz in
# legacy-static-site/ sowie im Branch v1-erstentwurf erhalten).
#
# lftp spricht ausschließlich SFTP und braucht auf dem Server keine
# zusätzliche Software (kein rsync-Binary nötig, wie es bei Shared-Hosting
# ohne SSH-Zugriff auf Zusatztools üblich ist).
#
# ÜBERGANGSSTAND (s. Pflichtenheft 4.4/4.5): Solange weder ein SSH-Zugang
# noch eine MySQL-Datenbank für die Testumgebung als Secrets hinterlegt
# sind, deployt dieser Workflow eine lauffähige, aber absichtlich
# datenbankfreie Version (SQLite/File-Driver, frisch generierter APP_KEY
# pro Lauf, keine echten Zugangsdaten nötig) – nur damit auf
# test.dpsg-trier.de sichtbar wird, dass die neue CMS-Basis läuft. Sobald
# echte DB-/Entra-/Brevo-Zugangsdaten als Secrets vorliegen, wird dieser
# Workflow entsprechend erweitert (s. TODO-Marker unten).
#
# Voraussetzung: In den Repository-Einstellungen unter
# "Settings" → "Secrets and variables" → "Actions" müssen folgende Secrets
# angelegt sein:
#   FTP_SERVER      – SFTP-Host, z. B. eine IP-Adresse oder ein Hostname
#   FTP_USERNAME    – Benutzername
#   FTP_PASSWORD    – Passwort
#   FTP_SERVER_DIR  – Zielverzeichnis auf dem Webspace, z. B. "/" oder "/httpdocs/"
#
# Hinweis: Trotz der Secret-Namen "FTP_*" wird hier SFTP (Port 22) verwendet
# – FTP und SFTP nutzen bei den meisten Hostern dieselben Zugangsdaten.

on:
  push:
    branches:
      - claude/dpsg-trier-homepage-design-jwdgs4
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, gd, zip, xml, curl, openssl, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: PHP-Abhängigkeiten installieren (nur Produktion)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Frontend-Assets bauen
        run: |
          npm ci
          npm run build

      # TODO sobald Secrets für DB_HOST/DB_DATABASE/DB_USERNAME/DB_PASSWORD,
      # ENTRA_CLIENT_ID/ENTRA_CLIENT_SECRET/ENTRA_TENANT_ID und BREVO_API_KEY
      # hinterlegt sind: hier per env:-Block einlesen und unten in die
      # .env schreiben statt der SQLite-/File-Platzhalterwerte; zusätzlich
      # "php artisan migrate --force" ergänzen (braucht dann SSH oder den
      # Marker-Datei-Cron-Fallback aus Pflichtenheft 4.4, da FTP keine
      # Befehle ausführen kann).
      - name: .env für die Testumgebung generieren (keine echten Secrets nötig)
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          touch database/database.sqlite
          cat > .env <<ENV
          APP_NAME="DPSG Diözesanverband Trier"
          APP_ENV=local
          APP_KEY=${APP_KEY}
          APP_DEBUG=false
          APP_URL=https://test.dpsg-trier.de
          APP_LOCALE=de
          APP_FALLBACK_LOCALE=de
          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=error
          DB_CONNECTION=sqlite
          SESSION_DRIVER=file
          SESSION_LIFETIME=480
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          ENV

      - name: lftp installieren
        run: sudo apt-get update && sudo apt-get install -y lftp

      # lftp meldet "hostname contains invalid characters", wenn im Secret
      # unsichtbare Zeichen stecken (typischerweise ein Windows-Zeilenende
      # \r oder ein Leerzeichen aus Copy&Paste). Dieser Schritt entfernt
      # führende/folgende Leerraumzeichen aus allen vier Secrets, bevor sie
      # verwendet werden, und schreibt die bereinigten Werte in $GITHUB_ENV
      # (nicht ins Log) – für alle folgenden Schritte des Jobs.
      - name: Secrets bereinigen (führende/folgende Leerzeichen, CRLF)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          trim() {
            local var="$1"
            var="${var#"${var%%[![:space:]]*}"}"
            var="${var%"${var##*[![:space:]]}"}"
            printf '%s' "$var"
          }
          {
            echo "FTP_SERVER=$(trim "$FTP_SERVER")"
            echo "FTP_USERNAME=$(trim "$FTP_USERNAME")"
            echo "FTP_PASSWORD=$(trim "$FTP_PASSWORD")"
            echo "FTP_SERVER_DIR=$(trim "$FTP_SERVER_DIR")"
          } >> "$GITHUB_ENV"

      - name: Per lftp über SFTP synchronisieren (inkl. Löschen entfernter Dateien)
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 22 "sftp://$FTP_SERVER" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set mirror:parallel-transfer-count 3
          mirror --reverse --delete --verbose \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob node_modules/ \
            --exclude-glob tests/ \
            --exclude-glob docs/ \
            --exclude-glob legacy-static-site/ \
            --exclude-glob .env.example \
            --exclude-glob .gitattributes \
            --exclude-glob .editorconfig \
            ./ "$FTP_SERVER_DIR"
          bye
          EOF
